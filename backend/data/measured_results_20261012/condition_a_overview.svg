<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">Condition A measured performance</title>
<desc id="desc">Accuracy, macro precision, macro recall, and macro F1 computed from 300 saved Condition A predictions.</desc>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212B}.title{font-size:25px;font-weight:700}.subtitle{font-size:14px;fill:#52606D}.label{font-size:15px}.small{font-size:12px;fill:#52606D}.value{font-size:14px;font-weight:700}</style>
<text class="title" x="70" y="58">Condition A — measured performance</text>
<text class="subtitle" x="70" y="86">Fin-Fact fixed sample · Ollama qwen2.5:3b · n = 300 · metrics from saved predictions</text>
<line x1="275.0" y1="135" x2="275.0" y2="460" stroke="#DCE2E8" stroke-width="1"/>
<text class="small" x="275.0" y="485" text-anchor="middle">0.0</text>
<line x1="397.0" y1="135" x2="397.0" y2="460" stroke="#DCE2E8" stroke-width="1"/>
<text class="small" x="397.0" y="485" text-anchor="middle">0.2</text>
<line x1="519.0" y1="135" x2="519.0" y2="460" stroke="#DCE2E8" stroke-width="1"/>
<text class="small" x="519.0" y="485" text-anchor="middle">0.4</text>
<line x1="641.0" y1="135" x2="641.0" y2="460" stroke="#DCE2E8" stroke-width="1"/>
<text class="small" x="641.0" y="485" text-anchor="middle">0.6</text>
<line x1="763.0" y1="135" x2="763.0" y2="460" stroke="#DCE2E8" stroke-width="1"/>
<text class="small" x="763.0" y="485" text-anchor="middle">0.8</text>
<line x1="885.0" y1="135" x2="885.0" y2="460" stroke="#DCE2E8" stroke-width="1"/>
<text class="small" x="885.0" y="485" text-anchor="middle">1.0</text>
<text class="label" x="257" y="184" text-anchor="end">Accuracy</text>
<rect x="275" y="162" width="115.90" height="34" rx="4" fill="#0072B2"/>
<text class="value" x="400.90" y="184">0.1900</text>
<text class="label" x="257" y="260" text-anchor="end">Macro precision</text>
<rect x="275" y="238" width="190.08" height="34" rx="4" fill="#009E73"/>
<text class="value" x="475.08" y="260">0.3116</text>
<text class="label" x="257" y="336" text-anchor="end">Macro recall</text>
<rect x="275" y="314" width="207.95" height="34" rx="4" fill="#E69F00"/>
<text class="value" x="492.95" y="336">0.3409</text>
<text class="label" x="257" y="412" text-anchor="end">Macro-F1</text>
<rect x="275" y="390" width="72.35" height="34" rx="4" fill="#CC79A7"/>
<text class="value" x="357.35" y="412">0.1186</text>
<text class="small" x="580.0" y="518" text-anchor="middle">Score (0–1)</text>
<text class="subtitle" x="70" y="525">No B-condition measurements are plotted: saved evidence-grounded predictions failed evidence validation.</text>
</svg>
