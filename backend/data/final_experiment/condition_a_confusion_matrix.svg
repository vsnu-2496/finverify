<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
<title id="title">Condition A confusion matrix</title>
<desc id="desc">Confusion matrix for the 300 saved Condition A predictions; rows are gold classes and columns are predicted classes.</desc>
<rect width="100%" height="100%" fill="#FFFFFF"/>
